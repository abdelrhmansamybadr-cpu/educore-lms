name: educore_mobile
description: "EduCore LMS - Mobile Application for Students, Teachers, and Parents"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  provider: ^6.1.1
  go_router: ^13.0.0
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  flutter_svg: ^2.0.10+1
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
